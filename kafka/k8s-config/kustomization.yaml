apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD sync-wave order:
#   wave 1 — namespace-scoped config: ConfigMap, PVC, Services
#   wave 2 — Kafka StatefulSet (waits for wave 1 to be healthy)
#   wave 3 — topics-job Sync hook (runs after Kafka is Ready)

resources:
  - namespace.yaml
  - kafka.yaml
  - topics-job.yaml
