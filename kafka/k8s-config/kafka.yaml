apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  # Controller quorum uses the headless service pod DNS so KRaft can
  # find itself even before the ClusterIP service is reachable.
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0.kafka-headless.kafka.svc.cluster.local:9093"
  # Internal listener on 9092, controller-only on 9093
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
  # Advertise the stable ClusterIP service so other namespaces can reach Kafka
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-service.kafka.svc.cluster.local:9092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  # Let producers auto-create topics; explicit topics are created by topics-job.yaml
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_LOG_RETENTION_HOURS: "168"       # 7 days
  KAFKA_LOG_SEGMENT_BYTES: "1073741824"  # 1 GB
  KAFKA_NUM_PARTITIONS: "3"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"  # single-node — no replication
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  # Stable KRaft cluster ID (base64url-encoded UUID, fixed so restarts are safe)
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
---
# Headless service — required by KRaft so pods can address each other by DNS
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
  labels:
    app: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
# ClusterIP service — the address other namespaces use to publish/consume
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: kafka
  labels:
    app: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9093
              name: controller
          envFrom:
            - configMapRef:
                name: kafka-config
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  # volumeClaimTemplates — StatefulSet creates and binds the PVC automatically
  # when the Pod is scheduled, avoiding the WaitForFirstConsumer deadlock with
  # ArgoCD sync-waves.
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
