apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: kafka
  annotations:
    # Runs after the Kafka StatefulSet is healthy (wave 2).
    # Re-runs on every deploy — idempotent because of --if-not-exists.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka-service 9092; do
                echo "Waiting for Kafka..."; sleep 3;
              done
              echo "Kafka is ready."
      containers:
        - name: create-topics
          image: apache/kafka:3.7.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              BOOTSTRAP="kafka-service.kafka.svc.cluster.local:9092"

              create_topic() {
                kafka-topics.sh --bootstrap-server $BOOTSTRAP \
                  --create --if-not-exists \
                  --topic "$1" \
                  --partitions 3 \
                  --replication-factor 1
                echo "Topic '$1' ready."
              }

              create_topic waste-events
              create_topic bin-events
              create_topic payment-events

              echo "All topics created."
              kafka-topics.sh --bootstrap-server $BOOTSTRAP --list
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
