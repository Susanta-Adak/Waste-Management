apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-svc
  namespace: argocd
  labels:
    app.kubernetes.io/name: notification-svc
    app.kubernetes.io/part-of: waste-management
  # Cascade-delete all managed resources when this Application is removed
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Susanta-Adak/Waste-Management.git
    targetRevision: dev
    path: notification-svc/k8s-config

  destination:
    server: https://kubernetes.default.svc
    namespace: notification-svc

  syncPolicy:
    automated:
      prune: true       # remove resources deleted from git
      selfHeal: true    # revert manual cluster changes
    syncOptions:
      - CreateNamespace=true          # creates notification-svc ns if missing
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  # Ignore runtime-only fields that ArgoCD would otherwise flag as drift
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas     # allow HPA to control replica count
