apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: notification-svc
  labels:
    app: pgbouncer
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."; sleep 2;
              done
              echo "PostgreSQL ready."

      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            # edoburu/pgbouncer reads these to auto-generate pgbouncer.ini
            # and userlist.txt — no manual config files needed
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: notification-svc-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: db-password
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: notification-svc-config
                  key: DB_NAME
            # Pooling settings
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "200"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: MIN_POOL_SIZE
              value: "5"
            - name: RESERVE_POOL_SIZE
              value: "5"
            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"
            - name: LOG_CONNECTIONS
              value: "0"
            - name: LOG_DISCONNECTIONS
              value: "0"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-service
  namespace: notification-svc
  labels:
    app: pgbouncer
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: pgbouncer
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
