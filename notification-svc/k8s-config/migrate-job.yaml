apiVersion: batch/v1
kind: Job
metadata:
  name: notification-migrate
  namespace: notification-svc
  annotations:
    # Sync hook — runs during the sync AFTER wave-1 (postgres) is healthy.
    # BeforeHookCreation deletes the previous Job so it re-runs on every deploy.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at postgres-service:5432..."
              until nc -z postgres-service 5432; do sleep 2; done
              echo "PostgreSQL is ready."
      containers:
        - name: migrate
          image: notification-svc:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              echo "Running Django system checks..."
              python manage.py check --database default
              echo "Applying migrations..."
              python manage.py migrate --noinput
              echo "Migrations complete."
          envFrom:
            - configMapRef:
                name: notification-svc-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: secret-key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: db-password
            # Override configmap's DB_HOST (pgbouncer-service) — migrations
            # hold long-running transactions that are incompatible with
            # PgBouncer transaction pooling, so connect directly to postgres.
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_CONN_MAX_AGE
              value: "0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
