apiVersion: batch/v1
kind: Job
metadata:
  name: notification-migrate
  namespace: notification-svc
  annotations:
    # Run BEFORE the application pods are updated, and clean up the previous
    # job run so ArgoCD can re-create it on every deploy.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at postgres-service:5432..."
              until nc -z postgres-service 5432; do sleep 2; done
              echo "PostgreSQL is ready."
      containers:
        - name: migrate
          image: notification-svc:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              echo "Running Django system checks..."
              python manage.py check --database default
              echo "Applying migrations..."
              python manage.py migrate --noinput
              echo "Migrations complete."
          envFrom:
            - configMapRef:
                name: notification-svc-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: secret-key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: db-password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
