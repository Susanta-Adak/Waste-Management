apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  namespace: notification-svc
  labels:
    app: notification-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-svc
  template:
    metadata:
      labels:
        app: notification-svc
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."; sleep 2;
              done
              echo "PostgreSQL is ready."
      containers:
        - name: notification-svc
          image: notification-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: notification-svc-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: secret-key
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: email-host-user
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: email-host-password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: db-password
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: twilio-account-sid
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secrets
                  key: twilio-auth-token
          readinessProbe:
            httpGet:
              path: /api/v1/notifications/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/notifications/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
