apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources are applied by ArgoCD in sync-wave order:
#   wave 0 (default) : namespace, secret, configmap
#   wave 1           : postgres  (StatefulSet + PVC + Service)
#   wave 2           : migrate   (PreSync Job — runs before app pods)
#   wave 3           : pgbouncer (connection pooler)
#   wave 4           : app deployments + service

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - pgbouncer.yaml
  - deployment.yaml
  - service.yaml
  - consumer-deployment.yaml
